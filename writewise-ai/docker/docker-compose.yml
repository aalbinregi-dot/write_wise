version: '3.9'

services:
  neo4j:
    image: neo4j:5.18
    container_name: writewise-neo4j
    environment:
      NEO4J_AUTH: neo4j/writewise123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "writewise123", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: writewise-backend
    environment:
      - SECRET_KEY=writewise-docker-secret-change-me
      - DEBUG=True
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=writewise123
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../ml:/ml
      - ..:/nandana_root
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: writewise-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  neo4j_data:
